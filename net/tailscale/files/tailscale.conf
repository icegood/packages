config settings 'settings'
	option log_stderr '1'
	option log_stdout '1'
	option port '41641'
	option state_file '/etc/tailscale/tailscaled.state'
	option tailscaled_config_file '/var/run/tailscale/tailscaled-config.hujson'

# tailscaled --config (schema alpha0) options
config daemon_settings 'daemon_settings'
