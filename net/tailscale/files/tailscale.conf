	# list advertise_routes '192.168.50.0/24'
	# option disable_snat '0'
	# option exit_node '100.x.y.z'
	# option allow_lan_while_using_exit_node '0'
	# option run_ssh_server '0'
	# option run_web_client '0'
	# option shields_up '0'
	# option posture_checking '0'
	# list advertise_services 'svc:my-service'
